global:
  scrape_interval: 10s

scrape_configs:
  - job_name: integration-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["127.0.0.1:__GATEWAY_PORT__"]
  - job_name: mock-partner
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["127.0.0.1:__PARTNER_PORT__"]
