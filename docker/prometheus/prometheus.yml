global:
  scrape_interval: 10s

scrape_configs:
  - job_name: integration-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["integration-gateway:8080"]
  - job_name: mock-partner
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["mock-partner:8081"]
